<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nvEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="nvGoldOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="nvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border glow -->
  <rect width="100" height="100" rx="26" fill="url(#nvBg)" />
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="url(#nvEmerald)" stroke-width="2" stroke-opacity="0.7" />

  <!-- Celestial Universe Orbit Ring (vornixverse) -->
  <ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(-30 50 50)" stroke="url(#nvGoldOrbit)" stroke-width="3" stroke-dasharray="4 2" stroke-opacity="0.85" />
  
  <!-- Orbiting Star -->
  <circle cx="21" cy="34" r="3.5" fill="#fbbf24" filter="url(#nvGlow)" />

  <!-- Central Vibrant Health & Nutrition Leaf -->
  <path d="M50 22 C34 22 28 38 28 52 C28 66 38 76 50 78 C62 76 72 66 72 52 C72 38 66 22 50 22 Z" fill="url(#nvEmerald)" />
  
  <!-- Leaf Center Life Vein & Neural Branches -->
  <path d="M50 26 L50 74" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M50 40 L40 33" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M50 50 L60 43" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M50 60 L42 54" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Core Radiant Star / Intelligence Nexus -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#nvGlow)" />
</svg>
